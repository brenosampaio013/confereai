# Configuração do Supabase CLI para o Meu Carrin (desenvolvimento local / deploy).
project_id = "meu-carrin"

[auth]
enable_signup = true
# Desligado no projeto em 19/11/2026, por decisão do dono: quem quiser usar a leitura
# automática precisa entrar na conta. O app já avisa isso quando a sessão anônima falta.
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# Desligada enquanto o envio de e-mail for o embutido do Supabase, que é limitado a poucas
# mensagens por hora e não serve para produção: com ela ligada, a maioria dos cadastros não
# receberia o link. Religar junto com um SMTP próprio (ver README, "Telas de conta").
enable_confirmations = false

[functions.receipt-ocr]
# A função exige um JWT válido do Supabase (usuário com conta ou sessão anônima).
verify_jwt = true

[functions.send-push]
# Chamada pelo agendador com o segredo PUSH_CRON_SECRET (não usa JWT de usuário).
verify_jwt = false

[functions.stripe-checkout]
# Abre o pagamento: exige o JWT da pessoa que vai assinar.
verify_jwt = true

[functions.stripe-portal]
# Portal de cobrança: exige o JWT da pessoa.
verify_jwt = true

[functions.stripe-webhook]
# Chamada pela Stripe, não por um usuário. A autenticidade vem da assinatura do corpo
# (cabeçalho stripe-signature), verificada dentro da função. Não pode exigir JWT.
verify_jwt = false

[functions.assistente]
# Assistente de voz: exige o JWT de uma conta de verdade (sessão anônima é recusada dentro
# da função, porque a cota é por pessoa).
verify_jwt = true
